<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Entre Amigos: grupos e atividades criados para compartilhar.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Entre Amigos">
  <meta property="og:description" content="Crie grupos, compartilhe atividades e participe com seus amigos.">
  <meta property="og:url" content="https://mbzerker.github.io/Entre-Amigos/">
  <title>Entre Amigos</title>
  <style>
    :root { color-scheme: dark; --bg:#090b14; --card:#141827; --text:#f7f7fb; --muted:#b6bdd3; --brand:#8b7cff; --brand2:#4dd7bd; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--text); background:radial-gradient(circle at 15% 10%,#292258 0,transparent 35rem),radial-gradient(circle at 90% 90%,#123f45 0,transparent 32rem),var(--bg); display:grid; place-items:center; padding:24px; }
    main { width:min(920px,100%); display:grid; grid-template-columns:1.1fr .9fr; gap:22px; }
    section { border:1px solid #2d334a; border-radius:28px; background:rgba(20,24,39,.9); box-shadow:0 28px 90px #0008; }
    .hero { padding:clamp(28px,6vw,64px); }
    .mark { width:82px; height:82px; border-radius:24px; overflow:hidden; box-shadow:0 16px 42px #6f64e855; }
    .mark img { width:100%; height:100%; display:block; }
    h1 { margin:28px 0 14px; font-size:clamp(42px,8vw,76px); line-height:.94; letter-spacing:-.055em; }
    p { margin:0; color:var(--muted); line-height:1.6; font-size:18px; }
    .panel { padding:30px; display:flex; flex-direction:column; justify-content:center; gap:16px; }
    .pill { align-self:flex-start; padding:8px 12px; border-radius:999px; background:#272c43; color:#dcd8ff; font-size:13px; font-weight:750; }
    .status { padding:18px; border-radius:18px; background:#0d101b; border:1px solid #252b40; color:var(--muted); }
    .button { display:block; padding:14px 16px; border-radius:14px; text-align:center; text-decoration:none; background:var(--brand); color:white; font-weight:800; }
    a { color:#d9d4ff; }
    @media (max-width:720px) { main{grid-template-columns:1fr}.hero{padding:34px}.panel{padding:24px} }
  </style>
  <script type="module" src="assets/client-release.mjs"></script>
</head>
<body data-release-channel="testing">
  <main>
    <section class="hero">
      <div class="mark"><img src="assets/icon-client.png" alt="Ícone do Entre Amigos"></div>
      <h1>Entre<br>Amigos</h1>
      <p>Um espaço para criar grupos, compartilhar atividades e jogar junto.</p>
    </section>
    <section class="panel">
      <span class="pill" data-release-version>Consultando versão…</span>
      <h2>Aplicativo Android</h2>
      <div class="status" data-release-status aria-live="polite">Baixe o aplicativo oficial do Entre Amigos para Android.</div>
      <a class="button" href="download/">Baixar Entre Amigos</a>
      <p>Recebeu um convite? Abra o link no celular com o Entre Amigos instalado.</p>
    </section>
  </main>
</body>
</html>

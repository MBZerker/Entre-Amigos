<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Entre Amigos — acesso administrativo</title>
  <style>
    :root{color-scheme:dark;--bg:#080a12;--card:#151927;--text:#f7f7fb;--muted:#b6bdd3;--brand:#8b7cff;--danger:#ff7d91}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at top,#2b245e,transparent 34rem),var(--bg)}main{width:min(520px,100%);padding:clamp(26px,6vw,48px);border:1px solid #303650;border-radius:26px;background:#151927f2;box-shadow:0 28px 90px #0009}h1{margin:0 0 10px;font-size:38px}p{color:var(--muted);line-height:1.55}label{display:block;margin-top:18px;font-weight:750}input{width:100%;margin-top:7px;padding:14px;border:1px solid #3b4260;border-radius:13px;background:#0d101b;color:var(--text);font:inherit}.password{display:grid;grid-template-columns:1fr auto}.password input{grid-column:1/3;grid-row:1}.password button{grid-column:2;grid-row:1;margin:8px;border:0;background:transparent;color:#dcd8ff;font-size:20px;cursor:pointer}button.primary,.download{width:100%;margin-top:22px;padding:15px;border:0;border-radius:14px;background:var(--brand);color:white;font:inherit;font-weight:850;cursor:pointer}.download{display:block;text-align:center;text-decoration:none}.download[hidden]{display:none}button:disabled{opacity:.55;cursor:wait}.status{min-height:24px;margin-top:16px}.error{color:var(--danger)}a{color:#dcd8ff}
  </style>
</head>
<body><main>
  <h1>Acesso ADM</h1>
  <p>O APK administrativo é criptografado. O download somente é liberado depois que o servidor confirma uma conta administrativa ativa.</p>
  <form id="login">
    <label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">Senha</label><div class="password"><input id="password" name="password" type="password" autocomplete="current-password" required><button id="eye" type="button" aria-label="Mostrar senha">👁</button></div>
    <div id="mfa" hidden>
      <label for="code">Código do autenticador</label><input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000">
    </div>
    <button class="primary" id="submit" type="submit">Entrar e preparar download</button>
  </form>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <a class="download" id="download" hidden>Baixar APK ADM</a>
  <p><a href="../">Voltar à página inicial</a></p>
  <script>
    const API="https://entre-amigos-api-preview.nectof.workers.dev";
    const form=document.getElementById("login"),email=document.getElementById("email"),password=document.getElementById("password"),mfa=document.getElementById("mfa"),code=document.getElementById("code"),submit=document.getElementById("submit"),status=document.getElementById("status"),eye=document.getElementById("eye"),download=document.getElementById("download");
    let challengeToken="";
    eye.addEventListener("click",()=>{const visible=password.type==="text";password.type=visible?"password":"text";eye.setAttribute("aria-label",visible?"Mostrar senha":"Ocultar senha")});
    form.addEventListener("submit",async event=>{
      event.preventDefault();submit.disabled=true;status.className="status";status.textContent="Confirmando acesso…";download.hidden=true;download.removeAttribute("href");
      let refreshToken="";
      try{
        let session;
        if(challengeToken){
          const verification=await fetch(`${API}/api/v1/auth/mfa/verify`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({challengeToken,code:code.value})});
          code.value="";
          if(!verification.ok)throw new Error("Código inválido, expirado ou já utilizado.");
          session=await verification.json();
        }else{
          const login=await fetch(`${API}/api/v1/auth/login`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value,deviceName:"GitHub Pages — download ADM"})});
          password.value="";
          if(!login.ok)throw new Error("Login ou senha inválidos.");
          session=await login.json();
          if(session.mfaRequired&&session.challengeToken){
            challengeToken=session.challengeToken;mfa.hidden=false;code.required=true;email.disabled=true;password.disabled=true;submit.textContent="Confirmar código e preparar download";status.textContent="Senha confirmada. Digite o código de 6 dígitos do autenticador.";code.focus();return;
          }
        }
        refreshToken=session.refreshToken;challengeToken="";mfa.hidden=true;code.required=false;
        const releaseResponse=await fetch(`${API}/api/v1/admin/download-release`,{headers:{Authorization:`Bearer ${session.accessToken}`}});
        if(releaseResponse.status===403)throw new Error("Esta conta não possui acesso ao aplicativo ADM.");
        if(!releaseResponse.ok)throw new Error("Download administrativo temporariamente indisponível.");
        const release=await releaseResponse.json();
        if(typeof release.downloadUrl!=="string"||!release.downloadUrl.startsWith(`${API}/api/v1/admin/download-apk?ticket=`))throw new Error("O servidor não retornou um link de download válido.");
        download.href=release.downloadUrl;download.download=release.filename;download.rel="noreferrer";download.textContent=`Baixar APK ADM ${release.versionName}`;download.hidden=false;
        status.textContent=`Acesso confirmado. Toque no botão abaixo em até 5 minutos para baixar o APK ADM ${release.versionName}.`;
      }catch(error){status.className="status error";status.textContent=error instanceof Error?error.message:"Não foi possível concluir o download."}
      finally{
        if(refreshToken)fetch(`${API}/api/v1/auth/logout`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({refreshToken})}).catch(()=>{});
        submit.disabled=false;
      }
    });
  </script>
</main></body>
</html>
